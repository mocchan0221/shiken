<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiken デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f3f5f2; --surface: #ffffff; --ink: #1d2420; --muted: #5b6a62; --line: #d8dfda;
  --accent: #2c7a68; --accent-soft: #dcebe5; --warm: #b8532c; --warm-soft: #f4e2d9;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #19201c; --ink: #e4ebe6; --muted: #98a79f; --line: #2c3631;
    --accent: #62c0a6; --accent-soft: #1d3a32; --warm: #e58a62; --warm-soft: #3d241b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19201c; --ink: #e4ebe6; --muted: #98a79f; --line: #2c3631;
  --accent: #62c0a6; --accent-soft: #1d3a32; --warm: #e58a62; --warm-soft: #3d241b; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.65;
  padding: 20px 16px 48px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2 { font-family: var(--font-display); font-weight: 800; margin: 0; letter-spacing: 0.02em; }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.2; }
h2 { font-size: 1.05rem; }
p { margin: 0; }
button { font: inherit; }
.lede { color: var(--muted); max-width: 46em; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctl > .label { font-size: 0.8rem; color: var(--muted); width: 3.5em; flex: none; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 4px 14px; border-radius: 999px; cursor: pointer; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip:focus-visible, .btn:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.main { display: grid; grid-template-columns: minmax(300px, 430px) minmax(0, 1fr); gap: 28px; align-items: start; }
.side { position: sticky; top: 12px; display: grid; gap: 14px; }
.prompt { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.2rem, 3vw, 1.5rem); text-align: center; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card {
  position: relative; border: 2px solid var(--line); border-radius: var(--radius); overflow: hidden;
  background: var(--surface); cursor: pointer; padding: 0; display: grid; min-width: 0; color: var(--ink);
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); }
.card:active { transform: scale(0.985); }
.card img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: var(--line); }
.card .audio { padding: 34px 10px 12px; display: grid; gap: 8px; }
.card audio { width: 100%; }
.card .text { padding: 30px 14px 14px; text-align: left; display: grid; gap: 6px; align-content: start; font-size: 0.92rem; line-height: 1.65; }
.card .text strong { font-size: 1rem; }
.card .text p { margin: 0; }
.card .tag {
  position: absolute; left: 6px; top: 6px; font-size: 0.72rem; font-weight: 700;
  background: var(--surface); border-radius: 6px; padding: 0 7px; opacity: 0.92;
}
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px;
  padding: 6px 14px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.note { font-size: 0.85rem; color: var(--muted); text-align: center; min-height: 1.4em; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
.stat .k { font-size: 0.75rem; color: var(--muted); }
.stat .v { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; }
.words { display: flex; flex-wrap: wrap; gap: 6px; }
.word { border-radius: 999px; padding: 1px 10px; font-size: 0.85rem; }
.word.up { background: var(--accent-soft); color: var(--accent); }
.word.down { background: var(--warm-soft); color: var(--warm); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.grid.audio, .grid.text { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.item { position: relative; border-radius: 8px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.item img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
.item .name { font-size: 0.8rem; padding: 6px 8px 6px 34px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .rank {
  position: absolute; left: 4px; top: 4px; font-size: 0.72rem; font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--surface); border-radius: 6px; padding: 0 6px; opacity: 0.92;
}
.item .move { position: absolute; right: 4px; top: 4px; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 0 6px; }
.move.up { background: var(--accent-soft); color: var(--accent); }
.move.down { background: var(--warm-soft); color: var(--warm); }
.empty { color: var(--muted); }
@media (max-width: 760px) {
  .main { grid-template-columns: 1fr; }
  .side { position: static; }
}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:8px">
    <h1>Shiken デモ</h1>
    <p class="lede">2 つのうち、質問により当てはまる方を選んでください。答えるたびに、全体の並びがあなたの感覚に合わせて入れ替わります。回答はこのブラウザの外には送られません。</p>
  </header>

  <p id="error" class="empty" hidden></p>

  <div style="display:grid;gap:8px">
    <div class="ctl" id="setChips"><span class="label">データ</span></div>
    <div class="ctl" id="questionChips"><span class="label">質問</span></div>
  </div>

  <div class="main">
    <section class="side" aria-label="2 択">
      <p class="prompt" id="prompt"></p>
      <div class="pair" id="pair"></div>
      <div class="row">
        <button class="btn" id="tie">同じくらい</button>
        <button class="btn" id="skip">別の組にする</button>
      </div>
      <p class="note" id="feedback"></p>
      <div class="stats">
        <div class="stat"><div class="k">回答</div><div class="v" id="nAnswers">0</div></div>
        <div class="stat"><div class="k">直近 10 問の予想の的中率</div><div class="v" id="hit">—</div></div>
        <div class="stat"><div class="k">素の価値尺度の残り</div><div class="v" id="base">1.00</div></div>
      </div>
      <div class="panel" id="explainPanel">
        <h2>あなたの価値尺度を言葉にすると</h2>
        <div><span class="k" style="font-size:.8rem;color:var(--muted)">高く見る</span><div class="words" id="up"></div></div>
        <div><span class="k" style="font-size:.8rem;color:var(--muted)">低く見る</span><div class="words" id="down"></div></div>
      </div>
      <div class="row">
        <button class="btn" id="save">価値尺度ファイルを保存</button>
        <label class="btn">価値尺度ファイルを読み込む<input type="file" id="load" accept=".json,application/json" hidden></label>
        <button class="btn" id="reset">はじめから</button>
      </div>
      <p class="note">キー操作: ← 左 / → 右 / ↓ 同じくらい</p>
    </section>

    <section style="display:grid;gap:10px" aria-label="全体の並び">
      <h2>あなたに合わせた並び</h2>
      <p class="note" style="text-align:left">右上の数字は、回答 0 件の並び (素の価値尺度) からの動きです。</p>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</div>

<script type="module">
import { Taste } from "./shiken.js";

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
let index = null, setIdx = 0, qIdx = 0, pack = null, taste = null, pair = null, baseRank = null;

const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch { return null; } },
  set(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch { /* 保存できなくても動く */ } },
  del(key) { try { localStorage.removeItem(key); } catch { /* 同上 */ } },
};

async function loadJSON(path) {
  const r = await fetch(path, { cache: "no-cache" });  // 書き出し直したデータを古いまま見せない
  if (!r.ok) throw new Error(`${path} を読めませんでした (${r.status})`);
  return r.json();
}

function chips(el, items, current, onPick) {
  el.querySelectorAll(".chip").forEach((c) => c.remove());
  items.forEach((it, k) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = it.label;
    b.setAttribute("aria-pressed", String(k === current));
    b.onclick = () => onPick(k);
    el.appendChild(b);
  });
}

function storageKey() {
  return `shiken-demo:${index.sets[setIdx].questions[qIdx].pack}`;
}

async function choose(s, q) {
  setIdx = s; qIdx = q;
  const set = index.sets[setIdx];
  chips($("setChips"), index.sets, setIdx, (k) => choose(k, 0));
  chips($("questionChips"), set.questions, qIdx, (k) => choose(setIdx, k));
  pack = await loadJSON(set.questions[qIdx].pack);
  const saved = store.get(storageKey());
  taste = saved ? Taste.fromProfile(pack, saved) : new Taste(pack);
  baseRank = new Map(new Taste(pack).rank().map((k, r) => [k, r]));
  $("prompt").textContent = pack.meta.prompt;
  $("grid").classList.toggle("audio", pack.meta.kind === "audio");
  $("grid").classList.toggle("text", pack.meta.kind === "text");
  $("explainPanel").hidden = !pack.words;
  $("feedback").textContent = "";
  next();
}

// 文のデータセットは、media に本文がそのまま入っている (1 行目が見出し)
function textParts(id) {
  const [title, ...body] = pack.meta.media[id].split("\n");
  return { title, body: body.join("\n").trim() };
}

function media(id, big) {
  const src = pack.meta.media[id];
  if (pack.meta.kind === "text") {
    const t = textParts(id);
    return `<div class="text"><strong>${esc(t.title)}</strong><p>${esc(t.body)}</p></div>`;
  }
  if (pack.meta.kind === "audio") {
    const name = id.split("/").pop();
    return `<div class="audio"><span>${esc(name)}</span><audio controls preload="none" src="${esc(src)}"></audio></div>`;
  }
  return `<img src="${esc(src)}" alt="" loading="${big ? "eager" : "lazy"}">`;
}

function next() {
  pair = taste.nextPair();
  const el = $("pair");
  el.innerHTML = "";
  pair.forEach((id, k) => {
    const card = document.createElement(pack.meta.kind === "audio" ? "div" : "button");
    card.className = "card";
    card.innerHTML = `<span class="tag">${k === 0 ? "左" : "右"}</span>${media(id, true)}`;
    if (pack.meta.kind === "audio") {
      const pick = document.createElement("button");
      pick.className = "btn primary";
      pick.textContent = "こっち";
      pick.style.margin = "0 10px 10px";
      pick.onclick = () => answer(id);
      card.appendChild(pick);
    } else card.onclick = () => answer(id);
    el.appendChild(card);
  });
  render();
}

function answer(prefer) {
  const [a, b] = pair;
  const p = taste.answer(a, b, { prefer });
  if (prefer !== null) {
    const guess = p > 0.5 ? a : b;
    const conf = Math.round(Math.max(p, 1 - p) * 100);
    $("feedback").textContent = `答える前の予想: ${guess === a ? "左" : "右"} (${conf}%) — ${guess === prefer ? "当たり" : "外れ"}`;
  } else $("feedback").textContent = "同じくらい、として記録しました";
  store.set(storageKey(), { answers: taste.answers });
  next();
}

function render() {
  $("nAnswers").textContent = taste.answers.length;
  const h = taste.hitRate(10);
  $("hit").textContent = h === null ? "—" : `${Math.round(h * 100)}%`;
  $("base").textContent = taste.baseWeight.toFixed(2);
  if (pack.words) {
    const ex = taste.answers.length ? taste.explain(6) : { up: [], down: [] };
    const words = (list, cls) => list.length ? list.map(([w]) => `<span class="word ${cls}">${esc(w)}</span>`).join("")
      : `<span class="empty">まだありません</span>`;
    $("up").innerHTML = words(ex.up, "up");
    $("down").innerHTML = words(ex.down, "down");
  }
  const grid = $("grid");
  grid.innerHTML = "";
  taste.rank().forEach((id, r) => {
    const d = baseRank.get(id) - r;
    const div = document.createElement("div");
    div.className = "item";
    const kind = pack.meta.kind;
    const name = kind === "text" ? textParts(id).title : id.split("/").pop();
    if (kind === "text") div.title = textParts(id).body;
    div.innerHTML = `${kind === "image" || !kind ? media(id, false) : ""}<span class="rank">${r + 1}</span>`
      + (d ? `<span class="move ${d > 0 ? "up" : "down"}">${d > 0 ? "↑" : "↓"}${Math.abs(d)}</span>` : "")
      + (kind === "image" || !kind ? "" : `<div class="name">${esc(name)}</div>`);
    grid.appendChild(div);
  });
}

$("tie").onclick = () => answer(null);
$("skip").onclick = () => { taste.asked.add(taste._key(taste.index.get(pair[0]), taste.index.get(pair[1]))); next(); };
$("reset").onclick = () => { store.del(storageKey()); taste = new Taste(pack); $("feedback").textContent = ""; next(); };
$("save").onclick = () => {
  const blob = new Blob([JSON.stringify(taste.toProfile(), null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `shiken-${pack.meta.set}-${pack.meta.question}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
$("load").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    taste = Taste.fromProfile(pack, JSON.parse(await f.text()));
    store.set(storageKey(), { answers: taste.answers });
    $("feedback").textContent = `${taste.answers.length} 問の回答を読み込みました` + (taste.skipped ? ` (このデータにない項目への回答 ${taste.skipped} 問は使っていません)` : "");
    next();
  } catch (err) { $("feedback").textContent = `読み込めませんでした: ${err.message}`; }
  e.target.value = "";
};
document.addEventListener("keydown", (e) => {
  if (!pair || e.target.closest("input, textarea")) return;
  if (e.key === "ArrowLeft") answer(pair[0]);
  else if (e.key === "ArrowRight") answer(pair[1]);
  else if (e.key === "ArrowDown") { e.preventDefault(); answer(null); }
});

try {
  index = await loadJSON("data/index.json");
  await choose(0, 0);
} catch (err) {
  $("error").hidden = false;
  $("error").textContent = `データを読めませんでした (${err.message})。python demo/build.py <設定ファイル> で書き出してから、python -m http.server -d demo で開いてください。`;
}
</script>
</body>
</html>
